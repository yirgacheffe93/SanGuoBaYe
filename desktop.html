<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三国霸业</title>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="shell/shell.css">
</head>
<body>
<div id="app">

  <header id="titlebar">
    <div class="brand">
      <span class="brand-seal">霸</span>
      <span class="brand-name">三国霸业</span>
      <span class="brand-lib" id="lib-name">未选择版本</span>
    </div>
    <div class="titlebar-actions">
      <button id="btn-choose" class="icon-btn" type="button" title="选择版本（⌘O）" aria-label="选择版本">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M3 4h10M3 8h10M3 12h10"/>
        </svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" title="设置（⌘,）" aria-label="设置">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <circle cx="8" cy="8" r="2.1"/>
          <path d="M8 1.8v1.5M8 12.7v1.5M14.2 8h-1.5M3.3 8H1.8M12.4 3.6l-1 1M4.6 11.4l-1 1M12.4 12.4l-1-1M4.6 4.6l-1-1"/>
        </svg>
      </button>
      <button id="btn-fullscreen" class="icon-btn" type="button" title="全屏（⌘⌃F）" aria-label="全屏">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M6 2.2H2.2V6M10 2.2h3.8V6M13.8 10v3.8H10M2.2 10v3.8H6"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="stage">
    <div id="bezel">
      <div id="screen">
        <canvas id="lcd" width="160" height="96" aria-label="游戏画面"></canvas>
        <div id="scanlines"></div>

        <div id="loading" class="screen-overlay">
          <div class="spinner"></div>
          <p id="loading-text">正在启动引擎…</p>
        </div>

        <div id="boot-error" class="screen-overlay hidden">
          <h2>启动失败</h2>
          <pre id="boot-error-text"></pre>
          <div class="overlay-actions">
            <button id="btn-retry" class="btn primary" type="button">重新启动</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="toolbar">
    <div class="keypad" role="group" aria-label="虚拟按键">
      <button class="key dir" data-vk="up" type="button" title="上（↑）">▲</button>
      <button class="key dir" data-vk="down" type="button" title="下（↓）">▼</button>
      <button class="key dir" data-vk="left" type="button" title="左（←）">◀</button>
      <button class="key dir" data-vk="right" type="button" title="右（→）">▶</button>
      <button class="key enter" data-vk="enter" type="button" title="确认（Enter）">确认</button>
      <button class="key fn" data-vk="exit" type="button" title="返回（空格 / Esc）">返回</button>
      <button class="key fn" data-vk="help" type="button" title="帮助（H）">帮助</button>
      <button class="key fn" data-vk="search" type="button" title="查找（F / S）">查找</button>
    </div>
    <div class="hints">
      <span><kbd>↑↓←→</kbd> 移动</span>
      <span><kbd>Enter</kbd> 确认</span>
      <span><kbd>空格</kbd>/<kbd>Esc</kbd> 返回</span>
      <span><kbd>H</kbd> 帮助</span>
      <span><kbd>F</kbd> 查找</span>
    </div>
  </footer>

</div>

<div id="modal-layer" class="modal-layer hidden">
  <section class="modal" id="modal" role="dialog" aria-modal="true"></section>
</div>

<div id="toast" class="toast hidden" role="status"></div>

<script src="js/jquery.min.js"></script>
<script src="js/encoding-indexes.js"></script>
<script src="js/encoding.js"></script>
<script src="js/sprintf.js"></script>
<script src="js/lcd.js"></script>
<script src="shell/boot-hook.js"></script>
<script src="js/baye.js"></script>
<script src="js/bridge.js"></script>
<script src="shell/storage.js"></script>
<script src="shell/shell.js"></script>
</body>
</html>
